name: Project 11 CI

on:
  push:
    branches: [main]
    paths:
      - "projects/11_sql_reporting_agent/**"
      - ".github/workflows/project-11-ci.yml"
  pull_request:
    paths:
      - "projects/11_sql_reporting_agent/**"
      - ".github/workflows/project-11-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyodbc dynamically links against libodbc.so.2 at import time, even
      # though these tests never open a real DB connection.
      - name: Install unixODBC runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: projects/11_sql_reporting_agent
        run: python -m unittest discover -p "test_*.py" -v
