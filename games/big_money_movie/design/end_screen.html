<title>Big Money Movie End Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /*
    Deliberately a different backdrop from the title screen: not the
    dusk skyline, but a red-carpet / step-and-repeat award-wall moment --
    same Hollywood family (palette, marquee-bulb and searchlight motifs),
    different composition, because this screen's job is "you are the
    story now," not "here's the venue." Single-theme, same as the title
    screen.
  */
  :root{
    --sky-top:      #1B1240;
    --sky-mid:      #7C2F6C;
    --wall-base:    #2A1440;
    --gold:         #FFC94D;
    --gold-deep:    #B87615;
    --neon-pink:    #FF3D8B;
    --cream:        #FBEFDD;
    --carpet-red:   #9E1B3B;
    --carpet-red-deep: #6E1029;
    --pillar:       #362251;
    --neon-cyan:    #3DE3FF;
    --studio-bg:    #0B0810;
    --studio-glow:  rgba(255,61,139,.12);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 18px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 28%, var(--studio-glow), transparent 65%),
      var(--studio-bg);
    font-family:'Oswald',system-ui,sans-serif;
  }

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;
    width:min(348px,88vw);
    aspect-ratio:348/752;
    background:linear-gradient(160deg,#232228,#141317);
    border-radius:46px;
    padding:12px;
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      0 2px 0 rgba(255,255,255,.05) inset,
      0 0 0 1px rgba(255,255,255,.04);
  }
  .notch{
    position:absolute;
    top:24px; left:50%;
    width:8px; height:8px;
    background:#050505;
    border-radius:50%;
    transform:translateX(-50%);
    box-shadow:0 0 0 2px rgba(255,255,255,.06);
    z-index:5;
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    border-radius:34px;
    overflow:hidden;
    background:var(--sky-top);
  }
  .scene{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  .bottom-scrim{
    position:absolute;
    left:0; right:0; bottom:0;
    height:30%;
    background:linear-gradient(to bottom, rgba(11,8,16,0), rgba(11,8,16,.55) 45%, rgba(11,8,16,.88) 100%);
    pointer-events:none;
  }

  /* ---------- klieg lights, rising from the stage floor ---------- */
  .beam{ transform-origin: var(--ox) var(--oy); animation: sweep 6s ease-in-out infinite alternate; }
  .beam-l{ --ox:10px; --oy:866px; animation-delay:0s; }
  .beam-r{ --ox:390px; --oy:866px; animation-delay:.3s; }
  @keyframes sweep{
    0%   { transform:rotate(-4deg); }
    100% { transform:rotate(4deg); }
  }

  /* ---------- paparazzi camera flashes ---------- */
  .flash{ animation:camFlash 4.4s ease-in-out infinite; }
  @keyframes camFlash{
    0%, 90%, 100%{ opacity:0; }
    92%{ opacity:1; }
    95%{ opacity:.15; }
  }

  /* ---------- twinkling stars ---------- */
  .star{ animation:twinkle 3.4s ease-in-out infinite; }
  .star:nth-child(2){ animation-delay:.6s; }
  .star:nth-child(3){ animation-delay:1.4s; }
  .star:nth-child(4){ animation-delay:2s; }
  @keyframes twinkle{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }

  /* ---------- guesses recap: plays on load, then reveals the screen
     below it. A timed entrance (not scroll/observer-gated), so it plays
     automatically and settles on the end screen either way. ---------- */
  .recap-layer{
    position:absolute; inset:0;
    z-index:6;
    overflow:hidden;
    background:linear-gradient(180deg, rgba(20,15,28,.94), rgba(14,10,20,.97));
    animation:recapHold 4.6s ease forwards;
  }
  @keyframes recapHold{
    0%, 71%{ opacity:1; visibility:visible; }
    100%{ opacity:0; visibility:hidden; }
  }
  .recap-label{
    position:absolute; top:6%; left:0; right:0;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:3px;
    color:var(--gold);
    opacity:0;
    animation:labelIn .5s ease forwards;
    animation-delay:.1s;
    z-index:2;
  }
  @keyframes labelIn{ to{ opacity:.9; } }

  /* Big posters, tilted, leaning left/right, overlapping enough to fill
     the whole screen -- cropped by the phone screen's own rounded edge
     where they spill past it. */
  .card-field{ position:absolute; inset:0; }
  .g-card{
    position:absolute;
    width:198px; height:296px;
    border-radius:9px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    opacity:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden;
    animation:cardIn .65s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes cardIn{
    0%{ opacity:0; transform:translateY(26px) scale(.8) rotate(var(--rot)); }
    100%{ opacity:1; transform:translateY(0) scale(1) rotate(var(--rot)); }
  }
  .g-card-field{ flex:1; display:flex; align-items:center; justify-content:center; }
  .g-card-field::after{
    content:"";
    width:34%; height:34%;
    border-radius:50%;
    border:2px solid rgba(58,35,6,.25);
  }
  .g-card-title-band{
    padding:12px 12px 14px;
    background:rgba(20,12,28,.4);
  }
  .g-card-title{
    display:block;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.3px;
    color:var(--cream);
    text-align:center;
    line-height:1.15;
  }
  .g-card.pastel-1{ background:linear-gradient(165deg,#E4D6F7,#CDB8EC); } /* lavender */
  .g-card.pastel-2{ background:linear-gradient(165deg,#CFF2E4,#AEE3CE); } /* mint */
  .g-card.pastel-3{ background:linear-gradient(165deg,#FBDCC2,#F5C29E); } /* peach */
  .g-card.pastel-4{ background:linear-gradient(165deg,#FCE0E6,#F7BFCB); } /* rose */
  .g-card.pastel-5{ background:linear-gradient(165deg,#D6E8FA,#B9D8F2); } /* sky */
  .g-card.pastel-6{ background:linear-gradient(165deg,#FBF2C4,#F3E29B); } /* butter */
  .g-card.correct{
    width:228px; height:340px;
    background:linear-gradient(165deg,#FCEBBE,#F7D480);
    border:3px solid var(--gold-deep);
    box-shadow:0 26px 52px rgba(0,0,0,.55), 0 0 30px rgba(255,201,77,.55);
    z-index:2;
  }
  .g-card.correct .g-card-title-band{ background:rgba(58,35,6,.28); }
  .g-card.correct .g-card-title{ color:#3A2306; font-weight:800; }
  .g-card-badge{
    position:absolute; top:-10px; right:-10px;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--gold);
    border:2.5px solid var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    color:#3A2306;
    z-index:3;
  }

  /* ---------- UI overlay ---------- */
  .ui-layer{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding:9% 8% 5%;
    text-align:center;
    z-index:3;
  }
  .title-lockup{ margin-top:2%; }
  .title-big{
    font-family:'Bungee',system-ui,sans-serif;
    font-size:clamp(30px, 9.6vw, 38px);
    line-height:.92;
    color:var(--gold);
    letter-spacing:.5px;
    text-shadow:
      1px 1px 0 var(--gold-deep),
      2px 2px 0 var(--gold-deep),
      3px 3px 0 var(--gold-deep),
      4px 4px 0 var(--gold-deep),
      5px 6px 10px rgba(0,0,0,.5);
  }
  .title-neon{
    margin-top:8px;
    font-family:'Monoton',cursive;
    font-size:clamp(20px, 6.6vw, 25px);
    letter-spacing:3px;
    color:#fff8ee;
    text-shadow:
      0 0 4px var(--neon-pink),
      0 0 12px var(--neon-pink),
      0 0 26px rgba(255,61,139,.75),
      0 0 46px rgba(255,61,139,.35);
    animation:flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,19%,21%,54%,56%,100%{ opacity:1; }
    20%,55%{ opacity:.82; }
  }
  .tagline{
    margin-top:10px;
    font-family:'Oswald',sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:13px;
    letter-spacing:.4px;
    color:var(--cream);
    opacity:.85;
  }

  .spacer{ flex:1; }

  /* ---------- movie ticket: the results stub ---------- */
  .ticket{
    align-self:center;
    margin-top:22px;
    display:flex;
    background:linear-gradient(100deg,#241634,#1B0F28);
    border:1px solid rgba(255,201,77,.55);
    -webkit-clip-path:polygon(6% 0,100% 0,100% 100%,6% 100%,6% 58%,0 50%,6% 42%);
            clip-path:polygon(6% 0,100% 0,100% 100%,6% 100%,6% 58%,0 50%,6% 42%);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .ticket-stub{
    display:flex; align-items:center; justify-content:center;
    width:30px;
    border-right:1.5px dashed rgba(255,201,77,.6);
    color:var(--gold);
    font-size:15px;
  }
  .ticket-main{
    text-align:left;
    padding:11px 20px 13px 14px;
  }
  .ticket-admit{
    display:block;
    font-size:9.5px;
    letter-spacing:2px;
    font-weight:600;
    color:var(--neon-pink);
  }
  .badge-eyebrow{
    display:block;
    margin-top:4px;
    font-size:10px;
    letter-spacing:1.6px;
    font-weight:600;
    color:var(--gold);
    opacity:.9;
  }
  .guessed-title{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--cream);
    margin-top:1px;
  }
  .time-value{
    display:block;
    font-size:23px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--cream);
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .stat-row{
    display:flex;
    gap:16px;
    margin-top:8px;
  }
  .stat-chip{ display:flex; flex-direction:column; }
  .stat-num{
    font-size:15px;
    font-weight:700;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .stat-label{
    font-size:7.5px;
    letter-spacing:1.2px;
    color:var(--cream);
    opacity:.75;
    margin-top:1px;
  }
  .ticket-barcode{
    margin-top:9px;
    width:88px; height:11px;
    background:repeating-linear-gradient(90deg,var(--cream) 0 2px,transparent 2px 4px);
    opacity:.55;
  }

  /* ---------- neon action: today's leaderboard ---------- */
  .scores-btn{
    margin-top:12px;
    width:100%;
    border-radius:999px;
    padding:12px 0;
    background:rgba(9,16,20,.5);
    border:1.5px solid var(--neon-cyan);
    color:var(--neon-cyan);
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:2.4px;
    text-shadow:0 0 6px var(--neon-cyan), 0 0 14px rgba(61,227,255,.6);
    box-shadow:
      0 0 10px rgba(61,227,255,.4),
      inset 0 0 12px rgba(61,227,255,.12);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    animation:neonPulse 3.4s ease-in-out infinite;
  }
  @keyframes neonPulse{
    0%,100%{ box-shadow:0 0 10px rgba(61,227,255,.4), inset 0 0 12px rgba(61,227,255,.12); }
    50%{ box-shadow:0 0 17px rgba(61,227,255,.7), inset 0 0 17px rgba(61,227,255,.22); }
  }
  .scores-btn:hover{ transform:translateY(-1px); }
  .scores-btn:active{ transform:translateY(1px); }
  .scores-btn:focus-visible{ outline:3px solid var(--neon-cyan); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .beam, .star, .title-neon, .scores-btn, .flash{ animation:none !important; }
    .beam-l{ transform:rotate(-2deg); }
    .beam-r{ transform:rotate(2deg); }
    .flash{ opacity:0; }
    /* Skip the recap sequence outright rather than replaying a motion
       sequence -- land straight on the end screen. */
    .recap-layer{ animation:none !important; opacity:0; visibility:hidden; }
    .recap-label, .g-card{ animation:none !important; }
  }
</style>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">

    <svg class="scene" viewBox="0 0 400 866" preserveAspectRatio="xMidYMid slice"
         role="img" aria-label="A red-carpet award-wall backdrop: two pillars strung with lights flanking a star-patterned step-and-repeat wall, a small lit theater entrance the carpet leads up to, klieg lights rising from the stage floor, paparazzi camera flashes, and a wide red carpet with velvet ropes and an embedded Walk of Fame star.">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="var(--sky-top)"/>
          <stop offset="55%" stop-color="var(--sky-mid)"/>
          <stop offset="100%" stop-color="var(--wall-base)"/>
        </linearGradient>
        <linearGradient id="beamGradL" gradientUnits="userSpaceOnUse" x1="10" y1="866" x2="10" y2="40">
          <stop offset="0%"  stop-color="#FFF3D6" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beamGradR" gradientUnits="userSpaceOnUse" x1="390" y1="866" x2="390" y2="40">
          <stop offset="0%"  stop-color="#FFE4EF" stop-opacity=".36"/>
          <stop offset="100%" stop-color="#FFE4EF" stop-opacity="0"/>
        </linearGradient>
        <pattern id="repeatWall" width="42" height="42" patternUnits="userSpaceOnUse">
          <circle cx="21" cy="21" r="1.6" fill="var(--gold)" opacity=".28"/>
        </pattern>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="400" height="866" fill="url(#sky)"/>

      <!-- stars -->
      <circle class="star" cx="48"  cy="80"  r="1.6" fill="var(--cream)"/>
      <circle class="star" cx="330" cy="64"  r="1.4" fill="var(--cream)"/>
      <circle class="star" cx="90"  cy="120" r="1.2" fill="var(--cream)"/>
      <circle class="star" cx="260" cy="50"  r="1.8" fill="var(--cream)"/>
      <circle cx="200" cy="36"  r="1.1" fill="var(--cream)" opacity=".6"/>
      <circle cx="360" cy="110" r="1.3" fill="var(--cream)" opacity=".6"/>

      <!-- klieg lights, rising from the stage floor -->
      <g class="beam beam-l"><polygon points="10,866 90,50 230,50" fill="url(#beamGradL)"/></g>
      <g class="beam beam-r"><polygon points="390,866 170,50 310,50" fill="url(#beamGradR)"/></g>

      <!-- step-and-repeat wall -->
      <rect x="0" y="330" width="400" height="480" fill="url(#repeatWall)"/>
      <rect x="0" y="330" width="400" height="480" fill="var(--wall-base)" opacity=".35"/>

      <!-- pillars, strung with lights -->
      <g>
        <rect x="58" y="330" width="20" height="470" fill="var(--pillar)"/>
        <rect x="50" y="320" width="36" height="14" fill="var(--pillar)"/>
        <rect x="50" y="790" width="36" height="14" fill="var(--pillar)"/>
        <circle cx="68" cy="350" r="2.4" fill="var(--gold)" filter="url(#softGlow)" opacity=".8"/>
        <circle cx="68" cy="350" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="400" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="450" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="500" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="550" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="600" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="650" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="700" r="2.4" fill="var(--gold)"/>
        <circle cx="68" cy="750" r="2.4" fill="var(--gold)"/>
      </g>
      <g>
        <rect x="322" y="330" width="20" height="470" fill="var(--pillar)"/>
        <rect x="314" y="320" width="36" height="14" fill="var(--pillar)"/>
        <rect x="314" y="790" width="36" height="14" fill="var(--pillar)"/>
        <circle cx="332" cy="350" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="400" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="450" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="500" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="550" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="600" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="650" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="700" r="2.4" fill="var(--gold)"/>
        <circle cx="332" cy="750" r="2.4" fill="var(--gold)"/>
      </g>

      <!-- small theater entrance, between the pillars -- gives the carpet
           somewhere to actually lead, instead of ending at bare wall -->
      <g>
        <polygon points="112,430 200,388 288,430" fill="var(--pillar)"/>
        <rect x="112" y="430" width="176" height="186" fill="var(--pillar)"/>
        <circle cx="200" cy="414" r="10" fill="var(--gold)" opacity=".85"/>
        <polygon points="200,407 202,413 208,413 203,417 205,423 200,419 195,423 197,417 192,413 198,413"
                 fill="var(--pillar)"/>

        <!-- doorway, warmly lit from inside -->
        <path d="M160,616 L160,540 A40,40 0 0 1 240,540 L240,616 Z" fill="var(--studio-bg)"/>
        <ellipse cx="200" cy="602" rx="44" ry="13" fill="var(--gold)" opacity=".28" filter="url(#softGlow)"/>

        <!-- small lit canopy over the door -->
        <rect x="148" y="520" width="104" height="8" rx="2" fill="var(--gold-deep)"/>
        <circle cx="156" cy="528" r="2" fill="var(--gold)"/>
        <circle cx="172" cy="528" r="2" fill="var(--gold)"/>
        <circle cx="188" cy="528" r="2" fill="var(--gold)"/>
        <circle cx="204" cy="528" r="2" fill="var(--gold)"/>
        <circle cx="220" cy="528" r="2" fill="var(--gold)"/>
        <circle cx="236" cy="528" r="2" fill="var(--gold)"/>

        <!-- thin light-strips down the facade's outer edges, echoing the pillars -->
        <circle cx="120" cy="470" r="1.8" fill="var(--gold)"/>
        <circle cx="120" cy="520" r="1.8" fill="var(--gold)"/>
        <circle cx="120" cy="570" r="1.8" fill="var(--gold)"/>
        <circle cx="280" cy="470" r="1.8" fill="var(--gold)"/>
        <circle cx="280" cy="520" r="1.8" fill="var(--gold)"/>
        <circle cx="280" cy="570" r="1.8" fill="var(--gold)"/>
      </g>

      <!-- paparazzi flashes -->
      <g class="flash" transform="translate(32,600)" style="animation-delay:0s"><circle r="13" fill="#fff" filter="url(#softGlow)"/><rect x="-1.2" y="-11" width="2.4" height="22" fill="#fff"/><rect x="-11" y="-1.2" width="22" height="2.4" fill="#fff"/></g>
      <g class="flash" transform="translate(372,560)" style="animation-delay:1.1s"><circle r="13" fill="#fff" filter="url(#softGlow)"/><rect x="-1.2" y="-11" width="2.4" height="22" fill="#fff"/><rect x="-11" y="-1.2" width="22" height="2.4" fill="#fff"/></g>
      <g class="flash" transform="translate(360,700)" style="animation-delay:2.3s"><circle r="13" fill="#fff" filter="url(#softGlow)"/><rect x="-1.2" y="-11" width="2.4" height="22" fill="#fff"/><rect x="-11" y="-1.2" width="22" height="2.4" fill="#fff"/></g>
      <g class="flash" transform="translate(40,700)" style="animation-delay:3.1s"><circle r="13" fill="#fff" filter="url(#softGlow)"/><rect x="-1.2" y="-11" width="2.4" height="22" fill="#fff"/><rect x="-11" y="-1.2" width="22" height="2.4" fill="#fff"/></g>
      <g class="flash" transform="translate(200,360)" style="animation-delay:1.7s"><circle r="11" fill="#fff" filter="url(#softGlow)"/><rect x="-1.2" y="-10" width="2.4" height="20" fill="#fff"/><rect x="-10" y="-1.2" width="20" height="2.4" fill="#fff"/></g>

      <!-- wide red carpet -->
      <polygon points="0,866 400,866 258,610 142,610" fill="var(--carpet-red)"/>
      <polygon points="0,866 400,866 258,610 142,610" fill="url(#repeatWall)" opacity=".15"/>

      <!-- soft light pooling on the carpet, under the string-lights and flashes -->
      <ellipse cx="200" cy="760" rx="130" ry="70" fill="var(--gold)" opacity=".1" filter="url(#softGlow)"/>

      <!-- pile texture: nap lines converging toward the stage -->
      <g stroke="var(--carpet-red-deep)" stroke-width="1" opacity=".4">
        <line x1="156" y1="610" x2="48"  y2="866"/>
        <line x1="171" y1="610" x2="100" y2="866"/>
        <line x1="186" y1="610" x2="152" y2="866"/>
        <line x1="214" y1="610" x2="248" y2="866"/>
        <line x1="229" y1="610" x2="300" y2="866"/>
        <line x1="244" y1="610" x2="352" y2="866"/>
      </g>
      <g stroke="#C23459" stroke-width="1" opacity=".3">
        <line x1="163" y1="610" x2="74"  y2="866"/>
        <line x1="221" y1="610" x2="326" y2="866"/>
      </g>
