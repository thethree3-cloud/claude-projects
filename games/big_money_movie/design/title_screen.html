<title>Big Money Movie Title Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /*
    This screen commits to one visual world -- a dusk-lit Hollywood
    premiere -- and stays there in both light and dark hosts, per design
    guidance for a deliberately single-theme piece. Every color below is
    an explicit token, painted regardless of the viewer's OS theme.
  */
  :root{
    --sky-top:      #1B1240;
    --sky-mid:      #7C2F6C;
    --sky-horizon:  #FF8A52;
    --hills-far:    #362251;
    --hills-near:   #170F28;
    --gold:         #FFC94D;
    --gold-deep:    #B87615;
    --neon-pink:    #FF3D8B;
    --cream:        #FBEFDD;
    --carpet-red:   #9E1B3B;
    --neon-cyan:    #3DE3FF;
    --studio-bg:    #0B0810;
    --studio-glow:  rgba(255,138,82,.14);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 18px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 28%, var(--studio-glow), transparent 65%),
      var(--studio-bg);
    font-family:'Oswald',system-ui,sans-serif;
  }

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;
    width:min(348px,88vw);
    aspect-ratio:348/752;
    background:linear-gradient(160deg,#232228,#141317);
    border-radius:46px;
    padding:12px;
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      0 2px 0 rgba(255,255,255,.05) inset,
      0 0 0 1px rgba(255,255,255,.04);
  }
  .notch{
    position:absolute;
    top:24px; left:50%;
    width:8px; height:8px;
    background:#050505;
    border-radius:50%;
    transform:translateX(-50%);
    box-shadow:0 0 0 2px rgba(255,255,255,.06);
    z-index:5;
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    border-radius:34px;
    overflow:hidden;
    background:var(--sky-top);
  }
  .scene{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  /* Local scrim, only behind the ticket + button -- not a full-scene
     vignette (that obscured the illustration and was removed). Fades in
     from nothing above the ticket to a near-solid ground right behind
     the button, so the CTA sits on a clean field instead of directly on
     the marquee/red-carpet artwork. */
  .bottom-scrim{
    position:absolute;
    left:0; right:0; bottom:0;
    height:30%;
    background:linear-gradient(to bottom, rgba(11,8,16,0), rgba(11,8,16,.55) 45%, rgba(11,8,16,.88) 100%);
    pointer-events:none;
  }
  /* ---------- searchlight sweep ---------- */
  .beam{ transform-origin: var(--ox) var(--oy); animation: sweep 6s ease-in-out infinite alternate; }
  .beam-l{ --ox:112px; --oy:590px; animation-delay:0s; }
  .beam-r{ --ox:288px; --oy:590px; animation-delay:.3s; }
  @keyframes sweep{
    0%   { transform:rotate(-7deg); }
    100% { transform:rotate(7deg); }
  }

  /* ---------- neon skyline, behind the theater ---------- */
  .bld-gold{ filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 7px rgba(255,201,77,.55)); }
  .bld-pink{ filter:drop-shadow(0 0 3px var(--neon-pink)) drop-shadow(0 0 7px rgba(255,61,139,.55)); }
  .bld-cyan{ filter:drop-shadow(0 0 3px var(--neon-cyan)) drop-shadow(0 0 7px rgba(61,227,255,.5)); }

  /* ---------- twinkling stars ---------- */
  .star{ animation:twinkle 3.4s ease-in-out infinite; }
  .star:nth-child(2){ animation-delay:.6s; }
  .star:nth-child(3){ animation-delay:1.4s; }
  .star:nth-child(4){ animation-delay:2s; }
  @keyframes twinkle{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }

  /* ---------- UI overlay ---------- */
  .ui-layer{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding:9% 8% 5%;
    text-align:center;
  }
  .title-lockup{ margin-top:2%; }
  .title-big{
    font-family:'Bungee',system-ui,sans-serif;
    font-size:clamp(34px, 10.8vw, 44px);
    line-height:.92;
    color:var(--gold);
    letter-spacing:.5px;
    text-shadow:
      1px 1px 0 var(--gold-deep),
      2px 2px 0 var(--gold-deep),
      3px 3px 0 var(--gold-deep),
      4px 4px 0 var(--gold-deep),
      5px 6px 10px rgba(0,0,0,.5);
  }
  .title-neon{
    margin-top:6px;
    font-family:'Monoton',cursive;
    font-size:clamp(26px, 8.4vw, 32px);
    letter-spacing:4px;
    color:#fff8ee;
    text-shadow:
      0 0 4px var(--neon-pink),
      0 0 12px var(--neon-pink),
      0 0 26px rgba(255,61,139,.75),
      0 0 46px rgba(255,61,139,.35);
    animation:flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,19%,21%,54%,56%,100%{ opacity:1; }
    20%,55%{ opacity:.82; }
  }
  .tagline{
    margin-top:10px;
    font-family:'Oswald',sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:14px;
    letter-spacing:.4px;
    color:var(--cream);
    opacity:.85;
  }

  .spacer{ flex:1; }

  /* ---------- movie ticket ("today's category") ---------- */
  .ticket{
    align-self:center;
    display:flex;
    background:linear-gradient(100deg,#241634,#1B0F28);
    border:1px solid rgba(255,201,77,.55);
    -webkit-clip-path:polygon(6% 0,100% 0,100% 100%,6% 100%,6% 58%,0 50%,6% 42%);
            clip-path:polygon(6% 0,100% 0,100% 100%,6% 100%,6% 58%,0 50%,6% 42%);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .ticket-stub{
    display:flex; align-items:center; justify-content:center;
    width:30px;
    border-right:1.5px dashed rgba(255,201,77,.6);
    color:var(--gold);
    font-size:15px;
  }
  .ticket-main{
    text-align:left;
    padding:11px 20px 13px 14px;
  }
  .ticket-admit{
    display:block;
    font-size:9.5px;
    letter-spacing:2px;
    font-weight:600;
    color:var(--neon-pink);
  }
  .badge-eyebrow{
    display:block;
    margin-top:4px;
    font-size:10.5px;
    letter-spacing:1.6px;
    font-weight:600;
    color:var(--gold);
    opacity:.9;
  }
  .badge-value{
    display:block;
    font-size:16px;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--cream);
    margin-top:2px;
  }
  .ticket-barcode{
    margin-top:8px;
    width:88px; height:11px;
    background:repeating-linear-gradient(90deg,var(--cream) 0 2px,transparent 2px 4px);
    opacity:.55;
  }

  .play-btn{
    margin-top:14px;
    width:100%;
    border:none;
    border-radius:999px;
    padding:14px 0;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:2.5px;
    color:#3A2306;
    background:linear-gradient(180deg,#FFE29A 0%,var(--gold) 45%,var(--gold-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -3px 0 rgba(0,0,0,.18) inset,
      0 10px 22px rgba(0,0,0,.45);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .play-btn:hover{ transform:translateY(-1px); }
  .play-btn:active{
    transform:translateY(1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 -1px 0 rgba(0,0,0,.18) inset,
      0 4px 10px rgba(0,0,0,.4);
  }
  .play-btn:focus-visible{
    outline:3px solid var(--cream);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .beam, .star, .title-neon{ animation:none !important; }
    .beam-l{ transform:rotate(-4deg); }
    .beam-r{ transform:rotate(4deg); }
  }
</style>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">

    <svg class="scene" viewBox="0 0 400 866" preserveAspectRatio="xMidYMid slice"
         role="img" aria-label="A caricature of a Hollywood movie palace at dusk, pagoda-roofed with a lit marquee and flanking palm trees, a neon-outlined city skyline behind it, the Hollywood sign on the hills, and two searchlights crossing in the sky above.">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="var(--sky-top)"/>
          <stop offset="55%" stop-color="var(--sky-mid)"/>
          <stop offset="100%" stop-color="var(--sky-horizon)"/>
        </linearGradient>
        <linearGradient id="beamGradL" gradientUnits="userSpaceOnUse" x1="112" y1="590" x2="112" y2="30">
          <stop offset="0%"  stop-color="#FFF3D6" stop-opacity=".38"/>
          <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beamGradR" gradientUnits="userSpaceOnUse" x1="288" y1="590" x2="288" y2="30">
          <stop offset="0%"  stop-color="#FFE4EF" stop-opacity=".34"/>
          <stop offset="100%" stop-color="#FFE4EF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="marqueeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFE29A"/>
          <stop offset="100%" stop-color="var(--gold-deep)"/>
        </linearGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="400" height="866" fill="url(#sky)"/>

      <!-- stars -->
      <circle class="star" cx="48"  cy="90"  r="1.6" fill="var(--cream)"/>
      <circle class="star" cx="330" cy="70"  r="1.4" fill="var(--cream)"/>
      <circle class="star" cx="90"  cy="150" r="1.2" fill="var(--cream)"/>
      <circle class="star" cx="260" cy="55"  r="1.8" fill="var(--cream)"/>
      <circle cx="200" cy="40"  r="1.1" fill="var(--cream)" opacity=".6"/>
      <circle cx="150" cy="110" r="1.1" fill="var(--cream)" opacity=".55"/>
      <circle cx="360" cy="140" r="1.3" fill="var(--cream)" opacity=".6"/>

      <!-- far ridge (also the base "ground" fill down to the bottom edge) -->
      <path d="M0,560 C65,500 130,522 200,507 C275,490 335,516 400,498 L400,866 L0,866 Z" fill="var(--hills-far)"/>

      <!-- HOLLYWOOD sign, on the far ridge -->
      <text x="200" y="504" text-anchor="middle" font-family="Oswald" font-weight="700"
            font-size="25" letter-spacing="4" fill="var(--cream)" opacity=".95">HOLLYWOOD</text>

      <!-- crossing searchlights, originating from behind the near ridge/theater -->
      <g class="beam beam-l"><polygon points="112,590 8,26 216,26" fill="url(#beamGradL)"/></g>
      <g class="beam beam-r"><polygon points="288,590 184,26 392,26" fill="url(#beamGradR)"/></g>

      <!-- near ridge -->
      <path d="M0,620 C80,560 160,592 200,576 C262,556 340,596 400,568 L400,866 L0,866 Z" fill="var(--hills-near)"/>

      <!-- neon skyline, behind the theater -- denser on the right, above where the ticket sits -->
      <g>
        <g class="bld-gold"><rect x="0" y="612" width="20" height="88" fill="var(--hills-near)" stroke="var(--gold)" stroke-width="1.3"/><rect x="5" y="622" width="3" height="4" fill="var(--gold)"/><rect x="12" y="622" width="3" height="4" fill="var(--gold)"/></g>
        <g class="bld-pink"><rect x="22" y="652" width="16" height="48" fill="var(--hills-near)" stroke="var(--neon-pink)" stroke-width="1.3"/><rect x="27" y="660" width="3" height="4" fill="var(--neon-pink)"/></g>
        <g class="bld-cyan"><rect x="40" y="628" width="18" height="72" fill="var(--hills-near)" stroke="var(--neon-cyan)" stroke-width="1.3"/><rect x="45" y="638" width="3" height="4" fill="var(--neon-cyan)"/><rect x="51" y="638" width="3" height="4" fill="var(--neon-cyan)"/></g>

        <g class="bld-pink"><rect x="308" y="654" width="15" height="46" fill="var(--hills-near)" stroke="var(--neon-pink)" stroke-width="1.3"/><rect x="313" y="662" width="3" height="4" fill="var(--neon-pink)"/></g>
        <g class="bld-gold"><rect x="325" y="618" width="19" height="82" fill="var(--hills-near)" stroke="var(--gold)" stroke-width="1.3"/><rect x="330" y="628" width="3" height="4" fill="var(--gold)"/><rect x="337" y="628" width="3" height="4" fill="var(--gold)"/></g>
        <g class="bld-cyan"><rect x="346" y="638" width="17" height="62" fill="var(--hills-near)" stroke="var(--neon-cyan)" stroke-width="1.3"/><rect x="351" y="648" width="3" height="4" fill="var(--neon-cyan)"/></g>
        <g class="bld-pink"><rect x="365" y="598" width="21" height="102" fill="var(--hills-near)" stroke="var(--neon-pink)" stroke-width="1.3"/><rect x="370" y="608" width="3" height="4" fill="var(--neon-pink)"/><rect x="378" y="608" width="3" height="4" fill="var(--neon-pink)"/><rect x="370" y="618" width="3" height="4" fill="var(--neon-pink)"/></g>
        <g class="bld-gold"><rect x="388" y="648" width="12" height="52" fill="var(--hills-near)" stroke="var(--gold)" stroke-width="1.3"/><rect x="392" y="658" width="3" height="4" fill="var(--gold)"/></g>
      </g>

      <!-- palm trees flanking the theater -->
      <g transform="translate(52,742)" stroke="var(--hills-near)" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M0,96 C-5,64 5,32 0,0"/>
        <path d="M0,0 C-20,-10 -36,-4 -44,7"/>
        <path d="M0,0 C15,-15 33,-11 44,-2"/>
        <path d="M0,0 C-7,-19 -4,-32 5,-43"/>
        <path d="M0,0 C10,-17 23,-27 36,-31"/>
      </g>
      <g transform="translate(348,742)" stroke="var(--hills-near)" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M0,96 C5,64 -5,32 0,0"/>
        <path d="M0,0 C20,-10 36,-4 44,7"/>
        <path d="M0,0 C-15,-15 -33,-11 -44,-2"/>
        <path d="M0,0 C7,-19 4,-32 -5,-43"/>
        <path d="M0,0 C-10,-17 -23,-27 -36,-31"/>
      </g>

      <!-- theater: pagoda-roofed movie palace, in silhouette -->
      <g>
        <rect x="100" y="700" width="200" height="140" fill="var(--hills-near)"/>
        <rect x="114" y="700" width="13" height="140" fill="var(--hills-far)" opacity=".5"/>
        <rect x="273" y="700" width="13" height="140" fill="var(--hills-far)" opacity=".5"/>

        <polygon points="80,700 110,656 290,656 320,700" fill="var(--hills-near)"/>
        <path d="M80,700 L64,676 L94,690 Z" fill="var(--hills-near)"/>
        <path d="M320,700 L336,676 L306,690 Z" fill="var(--hills-near)"/>

        <polygon points="150,656 170,616 230,616 250,656" fill="var(--hills-near)"/>
        <path d="M150,656 L137,633 L163,643 Z" fill="var(--hills-near)"/>
        <path d="M250,656 L263,633 L237,643 Z" fill="var(--hills-near)"/>

        <line x1="200" y1="616" x2="200" y2="590" stroke="var(--hills-near)" stroke-width="3"/>
        <circle cx="200" cy="585" r="5" fill="var(--gold)"/>

        <!-- marquee -->
        <rect x="126" y="762" width="148" height="4" fill="var(--gold)" opacity=".5" filter="url(#softGlow)"/>
        <rect x="128" y="766" width="144" height="46" rx="3" fill="url(#marqueeGrad)" stroke="var(--cream)" stroke-width="1.5"/>
        <text x="200" y="794" text-anchor="middle" font-family="Oswald" font-weight="600"
              font-size="13" letter-spacing="2" fill="#3A2306">NOW SHOWING</text>
        <circle cx="136" cy="812" r="2" fill="var(--cream)"/>
        <circle cx="164" cy="812" r="2" fill="var(--cream)"/>
        <circle cx="200" cy="812" r="2" fill="var(--cream)"/>
        <circle cx="236" cy="812" r="2" fill="var(--cream)"/>
        <circle cx="264" cy="812" r="2" fill="var(--cream)"/>
      </g>

      <!-- red carpet -->
      <polygon points="176,866 224,866 208,772 192,772" fill="var(--carpet-red)"/>
    </svg>

    <div class="bottom-scrim"></div>

    <div class="ui-layer">
      <div class="title-lockup">
        <div class="title-big">BIG MONEY</div>
        <div class="title-neon">MOVIE</div>
        <div class="tagline">Guess it before anyone else.</div>
      </div>

      <div class="spacer"></div>

      <div class="ticket">
        <div class="ticket-stub">🎬</div>
        <div class="ticket-main">
          <span class="ticket-admit">ADMIT ONE</span>
          <span class="badge-eyebrow">TODAY'S CATEGORY</span>
          <span class="badge-value">70s Cop Movies</span>
          <div class="ticket-barcode"></div>
        </div>
      </div>
      <button class="play-btn" type="button">Tap to Play</button>
    </div>

  </div>
</div>
